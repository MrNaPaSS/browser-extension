<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NMNH — Navigation & Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="nmnh-nav-container">

    <!-- ── Header ── -->
    <header class="nav-header">
      <div class="nav-brand">
        <div class="brand-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#logoGrad)" stroke-width="2.2">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#60a5fa"/>
                <stop offset="100%" stop-color="#a78bfa"/>
              </linearGradient>
            </defs>
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-title">NMNH</span>
          <span class="brand-tagline" id="popupAsset">HUB · Searching...</span>
        </div>
      </div>
      <div class="header-live-wrap">
        <div class="status-indicator">
          <div class="status-dot-pulse" id="globalStatusDot"></div>
          <span id="globalStatusText">READY</span>
        </div>
      </div>
    </header>

    <!-- ── Start Button ── -->
    <button class="start-btn" id="btnStart" aria-label="Start trading session">
      <div class="start-btn-glow"></div>
      <svg class="start-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <span class="start-text">СТАРТ</span>
    </button>

    <!-- ── Navigation Grid ── -->
    <section class="nav-section">
      <div class="nav-grid">
        <button class="nav-item" id="navTerminal" aria-label="Open Terminal">
          <div class="nav-icon-wrap" style="--icon-color: #60a5fa; --icon-glow: rgba(96,165,250,0.25);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
            </svg>
          </div>
          <span class="nav-text">NMNH</span>
        </button>
        <button class="nav-item" id="navDashboard" aria-label="My Cabinet">
          <div class="nav-icon-wrap" style="--icon-color: #34d399; --icon-glow: rgba(52,211,153,0.25);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
          </div>
          <span class="nav-text">PoTrade</span>
        </button>
        <button class="nav-item" id="navPromo" aria-label="Promo Codes">
          <div class="nav-icon-wrap" style="--icon-color: #f59e0b; --icon-glow: rgba(245,158,11,0.25);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
          </div>
          <span class="nav-text">Промокоды</span>
        </button>
        <button class="nav-item" id="navSupport" aria-label="Support">
          <div class="nav-icon-wrap" style="--icon-color: #f472b6; --icon-glow: rgba(244,114,182,0.25);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <span class="nav-text">Поддержка</span>
        </button>
        <button class="nav-item" id="navAcademy" aria-label="Academy">
          <div class="nav-icon-wrap" style="--icon-color: #a78bfa; --icon-glow: rgba(167,139,250,0.25);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1.1 2.7 3 6 3s6-1.9 6-3v-5"/>
            </svg>
          </div>
          <span class="nav-text">Академия</span>
        </button>
        <button class="nav-item" id="navChannel" aria-label="Our Channel">
          <div class="nav-icon-wrap" style="--icon-color: #38bdf8; --icon-glow: rgba(56,189,248,0.25);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.198 2.433a2.242 2.242 0 0 0-1.022.215l-16.5 7.5a1.09 1.09 0 0 0 .097 2.004l5.727 2.063 2.063 5.727a1.09 1.09 0 0 0 2.004.097l7.5-16.5a2.242 2.242 0 0 0-.869-1.106z"/>
            </svg>
          </div>
          <span class="nav-text">Наш канал</span>
        </button>
      </div>
    </section>

    <!-- ── Footer Container ── -->
    <div class="footer-container" id="footerContainer">
      <!-- ── Connecting State ── -->
      <div class="connecting-state" id="connectingState">
        <div class="connecting-dots">
          <span></span><span></span><span></span>
        </div>
        <span class="connecting-text">ПОДКЛЮЧЕНИЕ К СЕРВЕРУ</span>
      </div>

      <!-- ── Footer Stats ── -->
      <footer class="nav-footer" id="footerStats">
        <div class="footer-stat">
          <span class="footer-lbl">BALANCE</span>
          <span class="footer-val" id="footerBalance">$0.00</span>
        </div>
        <div class="footer-stat center">
          <span class="footer-lbl">W / L</span>
          <span class="footer-val blue" id="footerSessionWL">0 / 0</span>
        </div>
        <div class="footer-stat right">
          <span class="footer-lbl">SESSION P&L</span>
          <span class="footer-val pos" id="footerPnl">+$0.00</span>
        </div>
      </footer>

      <button class="reset-link" id="btnResetSession">Reset Session</button>
    </div>

  </div>
  <!-- ── Promo Modal ── -->
  <div class="modal-overlay" id="promoModal">
    <div class="promo-modal">
      <div class="modal-header">
        <span class="modal-title">ПРОМОКОДЫ</span>

        </div>
        <div class="promo-item">
