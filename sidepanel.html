<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NMNH — Side Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Design Tokens ── */
    :root {
      --bg-main:        hsl(222, 47%, 8%);
      --bg-panel:       hsla(222, 47%, 13%, 0.90);
      --bg-card:        hsla(222, 47%, 16%, 0.80);
      --bg-card-active: hsla(210, 100%, 60%, 0.10);
      --accent-primary: hsl(210, 100%, 66%);
      --accent-buy:     hsl(145, 63%, 46%);
      --accent-sell:    hsl(0,   72%, 57%);
      --accent-ai:      hsl(262, 83%, 67%);
      --accent-gold:    hsl(38,  92%, 58%);
      --text-main:      hsl(210, 20%, 97%);
      --text-dim:       hsl(210, 10%, 62%);
      --text-xs:        hsl(210, 10%, 40%);
      --panel-border:   1px solid hsla(210, 20%, 100%, 0.08);
      --panel-shadow:   0 8px 32px rgba(0,0,0,0.4);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 100px;
      --font:      'Outfit', 'Inter', system-ui, sans-serif;
      --font-data: 'Inter', 'Outfit', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100%;
      height: 100vh;
      background: radial-gradient(ellipse at 30% 15%, hsl(224,55%,13%) 0%, var(--bg-main) 65%);
      color: var(--text-main);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Header ── */
    .sp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: hsla(222, 47%, 10%, 0.92);
      border-bottom: 1px solid hsla(210, 20%, 100%, 0.07);
      flex-shrink: 0;
    }

    .sp-brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .sp-robot-icon {
      width: 32px; height: 32px;
      background: hsla(210,100%,60%,0.10);
      border: 1px solid hsla(210,100%,60%,0.22);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .sp-brand-text { display: flex; flex-direction: column; }
    .sp-name { font-size: 17px; font-weight: 900; letter-spacing: -0.3px; }
    .sp-version { font-size: 8.5px; color: var(--text-xs); font-family: var(--font-data); letter-spacing: 0.3px; }

    .sp-live {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 9px; font-weight: 700; letter-spacing: 0.7px;
      background: hsla(145,63%,46%,0.08);
      color: var(--accent-buy);
      border: 1px solid hsla(145,63%,46%,0.22);
      font-family: var(--font-data);
    }

    .sp-live-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent-buy);
      animation: pulse-dot 1.8s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.65); }
    }

    /* ─── Tab Nav ── */
    .sp-tabs {
      display: flex;
      border-bottom: 1px solid hsla(210, 20%, 100%, 0.07);
      background: hsla(222, 47%, 9%, 0.80);
      flex-shrink: 0;
    }

    .sp-tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 11px 6px;
      font-size: 9.5px;
      font-weight: 700;
      font-family: var(--font-data);
      letter-spacing: 0.8px;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.18s ease, border-color 0.18s ease;
    }

    .sp-tab:hover { color: var(--text-main); }
    .sp-tab.active {
      color: var(--accent-primary);
      border-bottom-color: var(--accent-primary);
    }

    /* ─── Panel Scroll Area ── */
    .sp-panels {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      scrollbar-width: thin;
      scrollbar-color: hsla(210,20%,100%,0.10) transparent;
    }

    .sp-panels::-webkit-scrollbar { width: 3px; }
    .sp-panels::-webkit-scrollbar-thumb {
      background: hsla(210,20%,100%,0.10);
      border-radius: 2px;
    }

    /* Panel visibility */
    .sp-panel { display: none; flex-direction: column; gap: 12px; }
    .sp-panel.active { display: flex; }

    /* ─── Entrance animation ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .sp-panel.active > * {
      animation: fadeIn 0.3s ease both;
    }

    /* ─── Shared Card ── */
    .sp-card {
      background: var(--bg-panel);
      border: var(--panel-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--panel-shadow);
      backdrop-filter: blur(12px);
    }

    /* ─── P&L Hero Card ── */
    .pnl-card {
      padding: 18px 18px 16px;
      background: linear-gradient(135deg,
        hsla(210,100%,18%,0.70) 0%,
        hsla(222,47%,13%,0.80) 100%);
      border: 1px solid hsla(210,100%,60%,0.16);
    }

    .pnl-label {
      font-size: 9px; font-weight: 700;
      color: hsla(210,20%,100%,0.55);
      letter-spacing: 0.8px;
      font-family: var(--font-data);
      margin-bottom: 4px;
    }

    .pnl-balance {
      font-size: 28px; font-weight: 900;
      letter-spacing: -0.6px;
      color: var(--text-main);
      line-height: 1.1;
    }

    .pnl-change {
      display: flex; align-items: center; gap: 6px;
      margin-top: 6px;
    }

    .pnl-badge {
      font-size: 11px; font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-family: var(--font-data);
    }

    .pnl-badge.pos { background: hsla(145,63%,46%,0.14); color: var(--accent-buy); }
    .pnl-badge.neg { background: hsla(0,72%,57%,0.14);  color: var(--accent-sell); }

    .pnl-since { font-size: 9.5px; color: var(--text-xs); font-family: var(--font-data); }

    /* Sparkline canvas */
    .sparkline-wrap { margin-top: 14px; }
    #sparklineCanvas { display: block; width: 100%; height: 50px; }

    /* ─── Stat Chips Row ── */
    .stat-chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-chip {
      background: var(--bg-card);
      border: var(--panel-border);
      border-radius: var(--radius-md);
      padding: 12px 8px;
      text-align: center;
      display: flex; flex-direction: column; gap: 4px;
    }

    .chip-label {
      font-size: 7.5px; font-weight: 700;
      color: var(--text-xs); letter-spacing: 0.7px;
      font-family: var(--font-data);
    }

    .chip-value {
      font-size: 16px; font-weight: 800;
      color: var(--text-main); letter-spacing: -0.4px;
    }

    .chip-value.green  { color: var(--accent-buy); }
    .chip-value.blue   { color: var(--accent-primary); }
    .chip-value.purple { color: var(--accent-ai); }

    .chip-sub {
      font-size: 8px; color: var(--text-xs);
      font-family: var(--font-data);
    }

    /* ─── Section heading ── */
    .sp-section-title {
      font-size: 9.5px; font-weight: 700;
      color: var(--text-dim); letter-spacing: 1px;
      font-family: var(--font-data);
      padding-bottom: 2px;
    }

    /* ─── Positions Table ── */
    .positions-table { padding: 12px 14px; }

    .pos-table {
      width: 100%; border-collapse: collapse;
    }

    .pos-table th {
      text-align: left; font-size: 7.5px; font-weight: 700;
      color: var(--text-dim); letter-spacing: 0.5px;
      padding: 0 0 7px;
      border-bottom: 1px solid hsla(210,20%,100%,0.06);
      font-family: var(--font-data);
    }

    .pos-table td {
      padding: 7px 0; font-size: 11px;
      color: var(--text-main);
      border-bottom: 1px solid hsla(210,20%,100%,0.04);
      font-family: var(--font-data);
    }

    .pos-table tbody tr:last-child td { border-bottom: none; }

    .td-buy  { color: var(--accent-primary); font-weight: 600; }
    .td-sell { color: var(--accent-sell);    font-weight: 600; }
    .td-pos  { color: var(--accent-buy);     font-weight: 600; }
    .td-neg  { color: var(--accent-sell);    font-weight: 600; }

    /* ─── Sentiment Bar ── */
    .sentiment-card { padding: 14px 16px; }

    .sentiment-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }

    .sentiment-title { font-size: 9.5px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.8px; font-family: var(--font-data); }
    .sentiment-label { font-size: 11px; font-weight: 800; color: var(--accent-buy); font-family: var(--font-data); }

    .sentiment-track {
      height: 6px;
      background: hsla(210,20%,100%,0.07);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .sentiment-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent-sell) 0%, var(--accent-buy) 100%);
      width: 0%;
      transition: width 0.9s cubic-bezier(0.22,1,0.36,1);
    }

    .sentiment-scale {
      display: flex; justify-content: space-between;
      font-size: 8px; color: var(--text-xs); font-family: var(--font-data);
    }

    /* ─── Signal Cards ── */
    .sp-signal {
      background: var(--bg-card);
      border: 1px solid hsla(210,20%,100%,0.07);
      border-left: 2px solid transparent;
      border-radius: var(--radius-md);
      padding: 13px 14px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .sp-signal.sig-buy  { border-left-color: var(--accent-buy); }
    .sp-signal.sig-sell { border-left-color: var(--accent-sell); }

    .sig-top {
      display: flex; align-items: center; gap: 10px;
    }

    .sig-asset { font-size: 13px; font-weight: 700; color: var(--text-main); flex: 1; font-family: var(--font-data); }

    .sig-badge {
      font-size: 9px; font-weight: 800; padding: 4px 10px;
      border-radius: var(--radius-full); letter-spacing: 0.4px;
      font-family: var(--font-data);
    }

    .sig-badge.buy  { background: hsla(145,63%,46%,0.14); color: var(--accent-buy); }
    .sig-badge.sell { background: hsla(0,72%,57%,0.14);  color: var(--accent-sell); }

    .sig-time { font-size: 9px; color: var(--text-xs); white-space: nowrap; font-family: var(--font-data); }

    .sig-conf-row { display: flex; align-items: center; gap: 8px; }

    .sig-conf-label { font-size: 8.5px; color: var(--text-xs); white-space: nowrap; font-family: var(--font-data); }

    .sig-conf-track {
      flex: 1; height: 4px;
      background: hsla(210,20%,100%,0.07);
      border-radius: 2px; overflow: hidden;
    }

    .sig-conf-fill {
      height: 100%; border-radius: 2px; width: 0%;
      transition: width 0.9s cubic-bezier(0.22,1,0.36,1);
    }

    .sig-conf-fill.buy  { background: var(--accent-buy); }
    .sig-conf-fill.sell { background: var(--accent-sell); }

    .sig-conf-pct { font-size: 10px; font-weight: 700; white-space: nowrap; font-family: var(--font-data); }
    .sig-conf-pct.buy  { color: var(--accent-buy); }
    .sig-conf-pct.sell { color: var(--accent-sell); }

    .sig-entry {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sig-entry-item { display: flex; flex-direction: column; gap: 2px; }
    .sig-entry-label { font-size: 7.5px; font-weight: 700; color: var(--text-xs); letter-spacing: 0.5px; font-family: var(--font-data); }
    .sig-entry-val { font-size: 11px; font-weight: 600; color: var(--text-main); font-family: var(--font-data); }

    /* ─── Strategy Cards ── */
    .strat-card {
      background: var(--bg-card);
      border: 1px solid hsla(210,20%,100%,0.07);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .strat-top {
      display: flex; align-items: center; gap: 12px;
    }

    .strat-icon {
      width: 36px; height: 36px;
      background: hsla(210,100%,60%,0.08);
      border: 1px solid hsla(210,100%,60%,0.15);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }

    .strat-info { flex: 1; }
    .strat-name { font-size: 13px; font-weight: 700; color: var(--text-main); }
    .strat-desc { font-size: 10px; color: var(--text-dim); margin-top: 2px; font-family: var(--font-data); }

    /* Toggle switch */
    .toggle-wrap { flex-shrink: 0; }

    .toggle {
      position: relative;
      width: 36px; height: 20px;
      display: inline-block;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-slider {
      position: absolute; inset: 0;
      background: hsla(210,20%,100%,0.12);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .toggle input:checked + .toggle-slider {
      background: var(--accent-buy);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(16px);
    }

    /* Win rate bar */
    .strat-stats {
      display: flex; align-items: center; gap: 10px;
    }

    .strat-stat { display: flex; flex-direction: column; gap: 2px; width: 48px; }
    .strat-stat-label { font-size: 7.5px; font-weight: 700; color: var(--text-xs); letter-spacing: 0.5px; font-family: var(--font-data); }
    .strat-stat-val { font-size: 12px; font-weight: 800; color: var(--text-main); font-family: var(--font-data); }

    .strat-bar-wrap { flex: 1; height: 4px; background: hsla(210,20%,100%,0.07); border-radius: 2px; overflow: hidden; }
    .strat-bar-fill { height: 100%; border-radius: 2px; background: var(--accent-primary); width: 0%; transition: width 0.9s cubic-bezier(0.22,1,0.36,1); }
    .strat-bar-pct { font-size: 10px; font-weight: 700; color: var(--accent-primary); font-family: var(--font-data); }

    /* ─── Action Buttons ── */
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .sp-btn {
      padding: 12px 10px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 12px; font-weight: 800;
      font-family: var(--font);
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .sp-btn-primary {
      background: var(--accent-buy);
      color: #032015;
      box-shadow: 0 4px 18px hsla(145,63%,46%,0.28);
    }

    .sp-btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .sp-btn-primary.active { background: var(--accent-sell); color: #fff; box-shadow: 0 4px 18px hsla(0,72%,57%,0.28); }

    .sp-btn-secondary {
      background: var(--bg-card);
      color: var(--text-dim);
      border: var(--panel-border);
    }

    .sp-btn-secondary:hover { color: var(--text-main); border-color: hsla(210,20%,100%,0.16); }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="sp-header">
    <div class="sp-brand">
      <div class="sp-robot-icon">
        <svg width="18" height="18" viewBox="0 0 28 28" fill="none">
          <rect x="4" y="9" width="20" height="14" rx="4" fill="#60a5fa"/>
          <circle cx="10" cy="15" r="2.2" fill="#0f172a"/>
          <circle cx="18" cy="15" r="2.2" fill="#0f172a"/>
          <rect x="10" y="19" width="8" height="1.8" rx="0.9" fill="#0f172a"/>
          <line x1="14" y1="9" x2="14" y2="5" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
          <circle cx="14" cy="3.5" r="2" fill="#60a5fa"/>
        </svg>
      </div>
      <div class="sp-brand-text">
        <span class="sp-name">NMNH</span>
        <span class="sp-version">Enterprise v2.1.0</span>
      </div>
    </div>
    <div class="sp-live" id="spLiveBadge">
      <div class="sp-live-dot"></div>
      LIVE
    </div>
  </header>

  <!-- Tab Navigation -->
  <nav class="sp-tabs" role="tablist">
    <button class="sp-tab active" data-tab="overview"    role="tab" aria-selected="true">OVERVIEW</button>
    <button class="sp-tab"        data-tab="signals"     role="tab" aria-selected="false">SIGNALS</button>
    <button class="sp-tab"        data-tab="strategies"  role="tab" aria-selected="false">STRATEGIES</button>
  </nav>

  <!-- Panel Content -->
  <div class="sp-panels">

    <!-- ── Overview Panel ── -->
    <div class="sp-panel active" id="panel-overview" role="tabpanel">

      <!-- P&L Hero -->
      <div class="sp-card pnl-card">
        <div class="pnl-label">ACCOUNT BALANCE</div>
        <div class="pnl-balance" id="spBalance">$5,824.30</div>
        <div class="pnl-change">
          <span class="pnl-badge pos" id="spPnlBadge">+$638.40</span>
          <span class="pnl-since">today's P&amp;L</span>
        </div>
        <div class="sparkline-wrap">
          <canvas id="sparklineCanvas" aria-label="Balance sparkline"></canvas>
        </div>
      </div>

      <!-- Stat chips -->
      <div class="stat-chips">
        <div class="stat-chip">
          <span class="chip-label">WIN RATE</span>
          <span class="chip-value green" id="spWinRate">76.4%</span>
          <span class="chip-sub">Last 30d</span>
        </div>
        <div class="stat-chip">
          <span class="chip-label">TRADES</span>
          <span class="chip-value blue" id="spTrades">42</span>
          <span class="chip-sub">Today</span>
        </div>
        <div class="stat-chip">
          <span class="chip-label">ACTIVE</span>
          <span class="chip-value purple">3</span>
          <span class="chip-sub">Strategies</span>
        </div>
      </div>

      <!-- Action row -->
      <div class="action-row">
        <button class="sp-btn sp-btn-primary" id="spBtnTrade">ACTIVATE BOT</button>
        <button class="sp-btn sp-btn-secondary" id="spBtnPanel">OPEN PANEL</button>
      </div>

      <!-- Active Positions -->
      <span class="sp-section-title">ACTIVE POSITIONS</span>
      <div class="sp-card positions-table">
        <table class="pos-table" id="spPositions">
          <thead>
            <tr>
              <th>ASSET</th>
              <th>TYPE</th>
              <th>PRICE</th>
              <th>P&amp;L</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

    </div>

    <!-- ── Signals Panel ── -->
    <div class="sp-panel" id="panel-signals" role="tabpanel">

      <!-- Sentiment -->
      <div class="sp-card sentiment-card">
        <div class="sentiment-header">
          <span class="sentiment-title">MARKET SENTIMENT</span>
          <span class="sentiment-label" id="spSentimentLabel">BULLISH 78%</span>
        </div>
        <div class="sentiment-track">
          <div class="sentiment-fill" id="spSentimentFill"></div>
        </div>
        <div class="sentiment-scale">
          <span>BEARISH</span>
          <span>NEUTRAL</span>
          <span>BULLISH</span>
        </div>
      </div>

      <!-- Signal cards -->
      <span class="sp-section-title">AI TRADE SIGNALS</span>
      <div id="spSignalsList" style="display:flex;flex-direction:column;gap:10px;"></div>

    </div>

    <!-- ── Strategies Panel ── -->
    <div class="sp-panel" id="panel-strategies" role="tabpanel">
      <span class="sp-section-title">STRATEGY ENGINE</span>
      <div id="spStrategiesList" style="display:flex;flex-direction:column;gap:10px;"></div>
    </div>

  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
